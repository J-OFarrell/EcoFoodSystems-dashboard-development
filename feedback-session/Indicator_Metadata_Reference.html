<style>
  :root {
    --green: #1d574f;

  }
  * { box-sizing: border-box; }
  body {

    margin: 0 auto;
    padding: 32px 24px;
    line-height: 1.45;
    font-size: 13px;
  }
  h1 {
    color: var(--green);
    font-size: 26px;
    margin-bottom: 4px;
  }
  .subtitle { color: #555; margin-top: 0; }
  .meta-line { color: #777; font-size: 11.5px; margin-bottom: 24px; }

  /* Cover table */
  table.cover {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0 8px;
    font-size: 11.5px;
  }
  table.cover th {
    background: var(--green);
    color: #fff;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
    width: 33.3%;
  }
  table.cover td {
    border: 1px solid #d5ddd9;
    vertical-align: top;
    padding: 8px 10px;
  }
  table.cover td .subdomain {
    font-weight: 700;
    color: var(--green);
    margin-top: 6px;
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  table.cover td .subdomain:first-child { margin-top: 0; }
  table.cover ul { margin: 2px 0 8px; padding-left: 16px; }
  table.cover li { margin-bottom: 1px; }
  .count-badge {
    font-weight: 400; font-size: 10.5px; color: #cfe0da;
  }

  /* Detail sections */
  h2.pillar {
    background: var(--green);
    color: #fff;
    padding: 10px 14px;
    font-size: 17px;
    border-radius: 6px 6px 0 0;
    margin: 34px 0 0;
    page-break-after: avoid;
  }
  .pillar-intro {
    background: var(--grey);
    padding: 6px 14px;
    margin: 0 0 14px;
    font-size: 12px;
    color: #444;
    border-radius: 0 0 6px 6px;
  }
  .pillar-block { page-break-inside: avoid; }
  h3.subdomain {
    color: var(--green);
    font-size: 14px;
    border-bottom: 2px solid var(--green);
    padding-bottom: 3px;
    margin: 22px 0 10px;
    page-break-after: avoid;
  }
  .indicator {
    border-left: 3px solid var(--green-light);
    padding: 6px 0 6px 14px;
    margin-bottom: 12px;
    page-break-inside: avoid;
  }
  .indicator .name { font-weight: 700; font-size: 13px; }
  .indicator .name .unit { font-weight: 400; color: #666; font-size: 11.5px; }
  .indicator .definition { margin-top: 3px; color: #333; }
  .indicator .meta {
    margin-top: 3px;
    font-size: 11px;
    color: #666;
  }
  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 8px;
    vertical-align: 1px;
  }
  .badge.hanoi { background: var(--green); color: #fff; }
  .badge.addis { background: #b07d3c; color: #fff; }
  .badge.both { background: #2f6f8f; color: #fff; }
  .badge.none { background: #ccc; color: #555; }
  .badge.wip { background: #f3e3b3; color: #7a5b00; }

  @media print {
    body { max-width: none; padding: 0 8mm; font-size: 11.5px; }
    .cover-page { page-break-after: always; }
    h1 { font-size: 22px; }
    .no-print { display: none; }
    a { color: inherit; text-decoration: none; }
  }
</style>

  aa: String(r["Available Addis"]||"").trim().toLowerCase() in {"1":1,"true":1,"yes":1,"y":1},
});
const WIP = r => String(r["in progress"]||"").trim().length > 0;

function badge(r) {
  const a = AVAIL(r);
  let b = a.hn && a.aa ? '<span class="badge both">HN+AA</span>'
        : a.hn ? '<span class="badge hanoi">HN</span>'
        : a.aa ? '<span class="badge addis">AA</span>'
        : '<span class="badge none">no data</span>';
  if (WIP(r)) b += '<span class="badge wip">WIP</span>';
  return b;
}
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// Group: pillar -> subdomain -> records (preserve CSV order)
const groups = {};
for (const r of DATA) {
  const p = (r["FCD Primary Pillar"]||"Other").trim();
  const sd = (r["FCD Sub-domain"]||"Unclassified").trim();
  ((groups[p] ??= {})[sd] ??= []).push(r);
}
const pillars = Object.keys(groups).sort();

// Cover table: one column per pillar (3 columns per row → 2 even rows for 6 pillars)
const chunks = [];
for (let i = 0; i < pillars.length; i += 3) chunks.push(pillars.slice(i, i+3));

let cover = "";
for (const chunk of chunks) {
  cover += "<tr>" + chunk.map(p => {
    const total = Object.values(groups[p]).reduce((n, arr) => n + arr.length, 0);
    return `<th>${esc(p)} <span class="count-badge">(${total})</span></th>`;
  }).join("") + "</tr><tr>";
  for (const p of chunk) {
    let cell = "";
    for (const sd of Object.keys(groups[p]).sort()) {
      cell += `<span class="subdomain">${esc(sd)}</span><ul>`;
      for (const r of groups[p][sd]) cell += `<li>${esc(r["Indicator name"])}</li>`;
      cell += "</ul>";
    }
    cover += `<td>${cell}</td>`;
  }
  cover += "</tr>";
}
document.getElementById("cover-table").innerHTML = cover;

// Detail sections
let body = "";
for (const p of pillars) {
  const total = Object.values(groups[p]).reduce((n, arr) => n + arr.length, 0);
  const hnCount = Object.values(groups[p]).flat().filter(r => AVAIL(r).hn).length;
  body += `<div class="pillar-block"><h2 class="pillar">${esc(p)}</h2>
  <div class="pillar-intro">${total} indicators · ${hnCount} with Hanoi data · sub-domains: ${Object.keys(groups[p]).sort().map(esc).join(", ")}</div>`;
  for (const sd of Object.keys(groups[p]).sort()) {
    body += `<h3 class="subdomain">${esc(sd)}</h3>`;
    for (const r of groups[p][sd]) {
      const unit = (r["Unit of measurement"]||"").trim();
      const def = (r["Definition (what the indicator measures)"]||"").trim();
      const src = (r["Data source"]||"").trim();
      const years = (r["Years available"]||"").trim();
      body += `<div class="indicator">
        <div class="name">${esc(r["Indicator name"])}${unit ? ` <span class="unit">· ${esc(unit)}</span>` : ""}${badge(r)}</div>
        <div class="definition">${esc(def) || "<em>No definition recorded.</em>"}</div>
        </div>`;
    }
  }
  body += "</div>";
}
document.getElementById("detail-body").innerHTML = body;
</script>
</body>
</html>
